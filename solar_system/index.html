<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System | 太阳系</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000011;
            font-family: 'Orbitron', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .title {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #4A90D9;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(74, 144, 217, 0.5);
            z-index: 10;
        }
        .subtitle {
            font-size: 12px;
            color: #6BA3E0;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: 400;
        }
        .legend {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: #8BB4E8;
            font-size: 11px;
            z-index: 10;
            background: rgba(0, 0, 17, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(74, 144, 217, 0.3);
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
        }
        .planet-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0 0 8px currentColor;
        }
        .controls-hint {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: #4A5568;
            font-size: 10px;
            z-index: 10;
            text-align: right;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="title">
        SOLAR SYSTEM
        <div class="subtitle">太阳系运行模拟</div>
    </div>
    <div class="legend">
        <div class="legend-item"><span class="planet-dot" style="background:#FDB813;color:#FDB813;"></span>太阳 Sun</div>
        <div class="legend-item"><span class="planet-dot" style="background:#A5A5A5;color:#A5A5A5;"></span>水星 Mercury</div>
        <div class="legend-item"><span class="planet-dot" style="background:#E6E6E6;color:#E6E6E6;"></span>金星 Venus</div>
        <div class="legend-item"><span class="planet-dot" style="background:#6B93D6;color:#6B93D6;"></span>地球 Earth</div>
        <div class="legend-item"><span class="planet-dot" style="background:#C1440E;color:#C1440E;"></span>火星 Mars</div>
        <div class="legend-item"><span class="planet-dot" style="background:#D4A574;color:#D4A574;"></span>木星 Jupiter</div>
        <div class="legend-item"><span class="planet-dot" style="background:#C9B896;color:#C9B896;"></span>土星 Saturn</div>
        <div class="legend-item"><span class="planet-dot" style="background:#B5E3E3;color:#B5E3E3;"></span>天王星 Uranus</div>
        <div class="legend-item"><span class="planet-dot" style="background:#5B87D1;color:#5B87D1;"></span>海王星 Neptune</div>
    </div>
    <div class="controls-hint">
        拖拽旋转视角 · 滚轮缩放
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(100, 60, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 50;
        controls.maxDistance = 500;

        // Stars background
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i++) {
            starsPositions[i] = (Math.random() - 0.5) * 1000;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.7, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Ambient light
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        // Sun
        const sunGeometry = new THREE.SphereGeometry(8, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xFDB813 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Sun glow
        const sunGlowGeometry = new THREE.SphereGeometry(10, 32, 32);
        const sunGlowMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xFFA500, 
            transparent: true, 
            opacity: 0.3 
        });
        const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
        scene.add(sunGlow);

        // Sun light
        const sunLight = new THREE.PointLight(0xFFFFFF, 2, 500);
        sun.add(sunLight);

        // Planet data: [radius, color, orbitRadius, orbitSpeed, orbitTilt]
        const planetData = [
            { name: 'Mercury', radius: 0.8, color: 0xA5A5A5, orbitRadius: 15, speed: 4.15, tilt: 0.03 },
            { name: 'Venus', radius: 1.2, color: 0xE6E6E6, orbitRadius: 22, speed: 1.62, tilt: 0.05 },
            { name: 'Earth', radius: 1.3, color: 0x6B93D6, orbitRadius: 30, speed: 1, tilt: 0.02 },
            { name: 'Mars', radius: 1.0, color: 0xC1440E, orbitRadius: 40, speed: 0.53, tilt: 0.04 },
            { name: 'Jupiter', radius: 3.5, color: 0xD4A574, orbitRadius: 60, speed: 0.084, tilt: 0.02 },
            { name: 'Saturn', radius: 3.0, color: 0xC9B896, orbitRadius: 80, speed: 0.034, tilt: 0.05 },
            { name: 'Uranus', radius: 2.0, color: 0xB5E3E3, orbitRadius: 100, speed: 0.012, tilt: 0.01 },
            { name: 'Neptune', radius: 1.9, color: 0x5B87D1, orbitRadius: 115, speed: 0.006, tilt: 0.02 }
        ];

        const planets = [];

        planetData.forEach((data, index) => {
            // Planet group (for orbit tilt)
            const planetGroup = new THREE.Group();
            planetGroup.rotation.x = data.tilt;

            // Orbit path
            const orbitGeometry = new THREE.BufferGeometry();
            const orbitPoints = [];
            const segments = 128;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                orbitPoints.push(new THREE.Vector3(Math.cos(angle) * data.orbitRadius, 0, Math.sin(angle) * data.orbitRadius));
            }
            orbitGeometry.setFromPoints(orbitPoints);
            const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x4A90D9, transparent: true, opacity: 0.2 });
            const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
            planetGroup.add(orbitLine);

            // Planet mesh
            const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.8,
                metalness: 0.2
            });
            const planet = new THREE.Mesh(geometry, material);
            
            // Planet container (for orbit rotation around sun)
            const planetContainer = new THREE.Group();
            planet.position.y = 0;
            planetContainer.add(planet);

            // Saturn rings
            if (data.name === 'Saturn') {
                const ringGeometry = new THREE.RingGeometry(data.radius + 0.5, data.radius + 2.5, 64);
                const ringMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xC9B896, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.7 
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                planet.add(ring);
            }

            planetGroup.add(planetContainer);
            scene.add(planetGroup);

            planets.push({
                container: planetContainer,
                group: planetGroup,
                speed: data.speed,
                angle: Math.random() * Math.PI * 2
            });
        });

        // Animation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Rotate planets
            planets.forEach((p, index) => {
                p.angle += p.speed * 0.01;
                p.container.rotation.y = p.angle;
            });

            // Sun pulse effect
            const pulse = 1 + Math.sin(time * 2) * 0.05;
            sunGlow.scale.set(pulse, pulse, pulse);

            // Stars slow rotation
            stars.rotation.y += 0.0001;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
