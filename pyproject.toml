[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "ziva"
version = "1.0.0"
description = "Ziva: a customizable LLM agent runtime and SDK (core library + optional desktop/CLI transports)"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Ziva Team" } ]
requires-python = ">=3.10"
keywords = ["ai-agent", "llm", "mcp", "desktop", "automation", "agent-runtime"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core runtime only — importing `ziva` and running `ziva.Agent` needs nothing
# else. HTTP/SSE server, CLI/REPL, and on-device STT live in the extras below.
dependencies = [
  "pyyaml>=6.0.1",
  "openai>=1.30.0",
  "mcp>=1.0.0",
  "anthropic>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/ziva-ai/ziva"
Repository = "https://github.com/ziva-ai/ziva"
Documentation = "https://github.com/ziva-ai/ziva/tree/main/docs"
Issues = "https://github.com/ziva-ai/ziva/issues"

[project.optional-dependencies]
# Desktop app: the aiohttp HTTP/SSE server + macOS on-device STT.
# Voice input uses mlx-whisper for on-device GPU transcription (Apple Silicon
# only). mlx_whisper.transcribe() shells out to `ffmpeg`; the bundle has no
# $PATH at startup, so imageio-ffmpeg ships a static ffmpeg and
# speech_to_text monkey-patches $PATH at call time (see
# transports/desktop_api/server.py). The PyInstaller bundle in
# ziva-backend.spec picks these up automatically when present in the build env.
desktop = [
  "aiohttp>=3.9.0",
  "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "imageio-ffmpeg>=0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # IM bridge — 飞书 (Lark) adapter. Imported lazily so the bridge loads
  # without it; only needed when the feishu channel is started.
  "lark-oapi>=1.4.0",
]
# CLI / interactive REPL.
cli = [
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.0",
]
# Everything (the desktop app build installs this).
all = ["ziva[desktop,cli]"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ziva[desktop,cli]",
]


[project.scripts]
ziva = "ziva.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ziva"]
