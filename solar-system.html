<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系动态运行模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #000;
            overflow: hidden;
            color: #fff;
        }

        /* 星空背景 */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); }
            50% { opacity: var(--max-opacity); }
        }

        /* 太阳系画布 */
        #solarSystem {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 信息面板 */
        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            z-index: 100;
            min-width: 200px;
            box-shadow: 0 0 30px rgba(50, 100, 255, 0.2);
        }

        .info-panel h1 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #64b5f6;
            text-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
        }

        .planet-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .planet-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .planet-item:hover {
            background: rgba(100, 150, 255, 0.2);
        }

        .planet-item.active {
            background: rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 10px rgba(100, 181, 246, 0.3);
        }

        .planet-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .planet-name {
            font-size: 14px;
        }

        /* 控制面板 */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 15px 25px;
            z-index: 100;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 0 30px rgba(50, 100, 255, 0.2);
        }

        .control-btn {
            background: rgba(100, 150, 255, 0.2);
            border: 1px solid rgba(100, 150, 255, 0.4);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .control-btn:hover {
            background: rgba(100, 150, 255, 0.4);
            box-shadow: 0 0 15px rgba(100, 181, 246, 0.3);
        }

        .control-btn.active {
            background: rgba(100, 181, 246, 0.4);
            box-shadow: 0 0 15px rgba(100, 181, 246, 0.5);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-control label {
            font-size: 14px;
            color: #aaa;
        }

        .speed-slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(100, 150, 255, 0.3);
            border-radius: 2px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #64b5f6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 181, 246, 0.5);
        }

        /* 行星详情面板 */
        .detail-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            z-index: 100;
            min-width: 280px;
            box-shadow: 0 0 30px rgba(50, 100, 255, 0.2);
            display: none;
        }

        .detail-panel.visible {
            display: block;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
        }

        .detail-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .detail-name {
            font-size: 20px;
            color: #fff;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-item {
            background: rgba(100, 150, 255, 0.1);
            padding: 10px;
            border-radius: 6px;
        }

        .info-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            color: #64b5f6;
        }

        /* 鼠标提示 */
        .tooltip {
            position: fixed;
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(100, 150, 255, 0.4);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 20px rgba(50, 100, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="starfield" id="starfield"></div>
    
    <!-- 太阳系 -->
    <canvas id="solarSystem"></canvas>
    
    <!-- 左侧行星列表 -->
    <div class="info-panel">
        <h1>🌌 太阳系</h1>
        <div class="planet-list" id="planetList"></div>
    </div>
    
    <!-- 行星详情 -->
    <div class="detail-panel" id="detailPanel">
        <button class="close-btn" onclick="hideDetail()">×</button>
        <div class="detail-header">
            <div class="detail-dot" id="detailDot"></div>
            <div class="detail-name" id="detailName">地球</div>
        </div>
        <div class="detail-info" id="detailInfo"></div>
    </div>
    
    <!-- 控制面板 -->
    <div class="controls">
        <button class="control-btn active" id="playBtn" onclick="togglePlay()">▶ 播放</button>
        <button class="control-btn" id="resetBtn" onclick="resetView()">⟲ 重置</button>
        <div class="speed-control">
            <label>速度</label>
            <input type="range" class="speed-slider" id="speedSlider" min="0" max="100" value="50" onchange="changeSpeed(this.value)">
        </div>
    </div>
    
    <!-- 提示框 -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // 行星数据
        const planets = [
            { 
                name: '水星', 
                color: '#A5A5A5', 
                radius: 4, 
                orbitRadius: 60, 
                speed: 0.04, 
                angle: 0,
                info: {
                    直径: '4,879 km',
                    距日距离: '5,790万 km',
                    公转周期: '88 地球日',
                    自转周期: '58.6 地球日'
                }
            },
            { 
                name: '金星', 
                color: '#E6C229', 
                radius: 6, 
                orbitRadius: 80, 
                speed: 0.03, 
                angle: Math.PI * 0.5,
                info: {
                    直径: '12,104 km',
                    距日距离: '1.082亿 km',
                    公转周期: '225 地球日',
                    自转周期: '243 地球日'
                }
            },
            { 
                name: '地球', 
                color: '#6B93D6', 
                radius: 7, 
                orbitRadius: 105, 
                speed: 0.02, 
                angle: Math.PI,
                info: {
                    直径: '12,742 km',
                    距日距离: '1.496亿 km',
                    公转周期: '365.25 天',
                    自转周期: '24 小时'
                }
            },
            { 
                name: '火星', 
                color: '#C1440E', 
                radius: 5, 
                orbitRadius: 135, 
                speed: 0.015, 
                angle: Math.PI * 1.5,
                info: {
                    直径: '6,779 km',
                    距日距离: '2.279亿 km',
                    公转周期: '687 地球日',
                    自转周期: '24.6 小时'
                }
            },
            { 
                name: '木星', 
                color: '#D8CA9D', 
                radius: 20, 
                orbitRadius: 180, 
                speed: 0.008, 
                angle: Math.PI * 0.25,
                info: {
                    直径: '139,820 km',
                    距日距离: '7.785亿 km',
                    公转周期: '11.86 地球年',
                    自转周期: '9.9 小时'
                }
            },
            { 
                name: '土星', 
                color: '#F4D59E', 
                radius: 17, 
                orbitRadius: 230, 
                speed: 0.006, 
                angle: Math.PI * 0.75,
                hasRings: true,
                info: {
                    直径: '116,460 km',
                    距日距离: '14.35亿 km',
                    公转周期: '29.46 地球年',
                    自转周期: '10.7 小时'
                }
            },
            { 
                name: '天王星', 
                color: '#89CFF0', 
                radius: 11, 
                orbitRadius: 280, 
                speed: 0.004, 
                angle: Math.PI * 1.25,
                hasRings: true,
                info: {
                    直径: '50,724 km',
                    距日距离: '28.75亿 km',
                    公转周期: '84 地球年',
                    自转周期: '17.2 小时'
                }
            },
            { 
                name: '海王星', 
                color: '#5B5DDF', 
                radius: 10, 
                orbitRadius: 320, 
                speed: 0.003, 
                angle: Math.PI * 1.75,
                info: {
                    直径: '49,528 km',
                    距日距离: '45.04亿 km',
                    公转周期: '165 地球年',
                    自转周期: '16.1 小时'
                }
            }
        ];

        const sun = { 
            name: '太阳', 
            color: '#FDB813', 
            radius: 35, 
            info: {
                直径: '1,392,684 km',
                距日距离: '0 km',
                表面温度: '5,500°C',
                核心温度: '1500万°C'
            }
        };

        // 全局变量
        let canvas, ctx;
        let centerX, centerY;
        let isPlaying = true;
        let speedMultiplier = 1;
        let selectedPlanet = null;
        let animationId;
        let scale = 1;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let dragStartX, dragStartY;

        // 初始化
        function init() {
            canvas = document.getElementById('solarSystem');
            ctx = canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            createStars();
            createPlanetList();
            
            canvas.addEventListener('wheel', handleWheel);
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('click', handleClick);
            
            animate();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            centerX = canvas.width / 2 + offsetX;
            centerY = canvas.height / 2 + offsetY;
        }

        // 创建星空
        function createStars() {
            const container = document.getElementById('starfield');
            container.innerHTML = '';
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--min-opacity', Math.random() * 0.3 + 0.2);
                star.style.setProperty('--max-opacity', Math.random() * 0.5 + 0.5);
                container.appendChild(star);
            }
        }

        // 创建行星列表
        function createPlanetList() {
            const list = document.getElementById('planetList');
            list.innerHTML = '';
            
            const sunItem = createPlanetItem(sun, true);
            list.appendChild(sunItem);
            
            planets.forEach((planet, index) => {
                const item = createPlanetItem(planet);
                item.addEventListener('click', () => selectPlanet(index));
                list.appendChild(item);
            });
        }

        function createPlanetItem(data, isSun = false) {
            const item = document.createElement('div');
            item.className = 'planet-item';
            
            const dot = document.createElement('div');
            dot.className = 'planet-dot';
            dot.style.background = data.color;
            if (isSun) {
                dot.style.boxShadow = `0 0 10px ${data.color}`;
            }
            
            const name = document.createElement('span');
            name.className = 'planet-name';
            name.textContent = data.name;
            
            item.appendChild(dot);
            item.appendChild(name);
            return item;
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isPlaying) {
                planets.forEach(planet => {
                    planet.angle += planet.speed * speedMultiplier;
                });
            }
            
            drawOrbits();
            drawSun();
            planets.forEach(drawPlanet);
            
            animationId = requestAnimationFrame(animate);
        }

        // 绘制轨道
        function drawOrbits() {
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.15)';
            ctx.lineWidth = 1;
            
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbitRadius * scale, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        // 绘制太阳
        function drawSun() {
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, sun.radius * scale * 1.5
            );
            gradient.addColorStop(0, '#FFFFFF');
            gradient.addColorStop(0.3, '#FDB813');
            gradient.addColorStop(0.6, '#F48C06');
            gradient.addColorStop(1, 'rgba(245, 140, 6, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius * scale * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 太阳本体
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius * scale, 0, Math.PI * 2);
            ctx.fillStyle = sun.color;
            ctx.shadowColor = '#FDB813';
            ctx.shadowBlur = 50;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 绘制行星
        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius * scale;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius * scale;
            
            // 行星本体
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * scale, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(
                x - planet.radius * scale * 0.3, 
                y - planet.radius * scale * 0.3, 0,
                x, y, planet.radius * scale
            );
            gradient.addColorStop(0, lightenColor(planet.color, 30));
            gradient.addColorStop(1, planet.color);
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 如果有光环
            if (planet.hasRings) {
                drawRings(x, y, planet);
            }
            
            // 行星名称
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = `${11 * scale}px Microsoft YaHei`;
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius * scale + 15 * scale);
        }

        // 绘制光环
        function drawRings(x, y, planet) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(0.3);
            ctx.scale(1, 0.3);
            
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius * scale * 1.8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(210, 180, 140, 0.6)';
            ctx.lineWidth = planet.radius * scale * 0.3;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius * scale * 2.2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(210, 180, 140, 0.4)';
            ctx.lineWidth = planet.radius * scale * 0.2;
            ctx.stroke();
            
            ctx.restore();
        }

        // 颜色处理
        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + 
                (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 + 
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 + 
                (B < 255 ? B < 1 ? 0 : B : 255)
            ).toString(16).slice(1);
        }

        // 选择行星
        function selectPlanet(index) {
            selectedPlanet = planets[index];
            
            document.querySelectorAll('.planet-item').forEach((item, i) => {
                item.classList.toggle('active', i === index + 1);
            });
            
            showDetail(selectedPlanet);
        }

        // 显示详情
        function showDetail(data) {
            const panel = document.getElementById('detailPanel');
            document.getElementById('detailDot').style.background = data.color;
            document.getElementById('detailName').textContent = data.name;
            
            const infoContainer = document.getElementById('detailInfo');
            infoContainer.innerHTML = '';
            
            for (const [key, value] of Object.entries(data.info)) {
                const item = document.createElement('div');
                item.className = 'info-item';
                item.innerHTML = `
                    <div class="info-label">${key}</div>
                    <div class="info-value">${value}</div>
                `;
                infoContainer.appendChild(item);
            }
            
            panel.classList.add('visible');
        }

        // 隐藏详情
        function hideDetail() {
            document.getElementById('detailPanel').classList.remove('visible');
            document.querySelectorAll('.planet-item').forEach(item => {
                item.classList.remove('active');
            });
            selectedPlanet = null;
        }

        // 控制函数
        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            btn.textContent = isPlaying ? '▶ 播放' : '⏸ 暂停';
            btn.classList.toggle('active', isPlaying);
        }

        function resetView() {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            resizeCanvas();
        }

        function changeSpeed(value) {
            speedMultiplier = value / 50;
        }

        // 鼠标事件
        function handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.max(0.3, Math.min(3, scale * delta));
        }

        function handleMouseDown(e) {
            isDragging = true;
            dragStartX = e.clientX - offsetX;
            dragStartY = e.clientY - offsetY;
            canvas.style.cursor = 'grabbing';
        }

        function handleMouseMove(e) {
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
                centerX = canvas.width / 2 + offsetX;
                centerY = canvas.height / 2 + offsetY;
            }
        }

        function handleMouseUp() {
            isDragging = false;
            canvas.style.cursor = 'default';
        }

        function handleClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 检查是否点击了行星
            for (const planet of planets) {
                const px = centerX + Math.cos(planet.angle) * planet.orbitRadius * scale;
                const py = centerY + Math.sin(planet.angle) * planet.orbitRadius * scale;
                const distance = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                
                if (distance <= planet.radius * scale + 10) {
                    selectPlanet(planets.indexOf(planet));
                    return;
                }
            }
            
            // 检查是否点击了太阳
            const sunDistance = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
            if (sunDistance <= sun.radius * scale + 10) {
                showDetail(sun);
                return;
            }
            
            hideDetail();
        }

        // 启动
        window.addEventListener('load', init);
    </script>
</body>
</html>
